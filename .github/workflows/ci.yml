name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=25

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Every guest-facing link the site sends people to must resolve.
      - name: Check booking platform links
        run: node scripts/check-platform-links.mjs
